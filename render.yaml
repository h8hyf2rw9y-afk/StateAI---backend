services:
  - type: web
    name: stateai-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUD
        value: authenticated
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ALLOW_SELF_SERVICE_SIGNUP
        value: "false"
      - key: RENOVA_ENCRYPTION_KEY
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
