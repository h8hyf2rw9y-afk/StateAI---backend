[project]
name = "stateai"
version = "0.1.0"
description = "PropPilot (State AI) backend — FastAPI + SQLAlchemy + Supabase Postgres"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.120",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "anthropic>=1.4.0",
    "httpx>=0.28",
    "apscheduler>=3.11.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
